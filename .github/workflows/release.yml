# GitHub Actions Workflow created for handling the release process based on the draft release prepared with the Build workflow.
# Running the publishPlugin task requires all the following secrets to be provided: PUBLISH_TOKEN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD, CERTIFICATE_CHAIN.
# See https://plugins.jetbrains.com/docs/intellij/plugin-signing.html for more information.

name: Release
on:
  # `published` only, deliberately. Two reasons, both from the GitHub docs:
  # - `prereleased` does NOT fire for a pre-release published from a draft, which is exactly how this repo
  #   releases, so subscribing to it would silently never run.
  # - `released` fires again when Marketplace watch promotes a pre-release to a release, which would re-run
  #   publishPlugin against a version the Marketplace already has.
  release:
    types: [ published ]

jobs:

  # Prepare and publish the plugin to JetBrains Marketplace repository
  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Update the Unreleased section with the current release note
      - name: Patch Changelog
        if: ${{ github.event.release.body != '' }}
        env:
          CHANGELOG: ${{ github.event.release.body }}
        run: |
          RELEASE_NOTE="./build/tmp/release_note.txt"
          mkdir -p "$(dirname "$RELEASE_NOTE")"
          echo "$CHANGELOG" > $RELEASE_NOTE

          ./gradlew patchChangelog --release-note-file=$RELEASE_NOTE

      # Is this version already on the Marketplace? Publishing the same version twice fails the job, and a
      # release can be re-run by hand. The update server list is the honest signal: an upload that is still
      # under review is absent from it, while the API's `approve` flag is true long before users can install.
      - name: Check Marketplace
        id: marketplace
        run: |
          PLUGIN_ID=$(grep -E '^pluginGroup' gradle.properties | cut -d '=' -f2 | tr -d ' ')
          VERSION="${{ github.event.release.tag_name }}"
          SERVED=$(curl -sf --max-time 30 "https://plugins.jetbrains.com/plugins/list/?pluginId=$PLUGIN_ID" \
            | grep -oE '<version>[^<]*</version>' | sed -E 's#</?version>##g' || true)
          echo "Marketplace is serving: ${SERVED:-nothing}"
          if printf '%s\n' "$SERVED" | grep -qx "$VERSION"; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$VERSION is already on the Marketplace - skipping publishPlugin"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Publish the plugin to JetBrains Marketplace
      - name: Publish Plugin
        if: ${{ steps.marketplace.outputs.already != 'true' }}
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      # Upload an artifact as a release asset
      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} ./build/distributions/*

      # Create a pull request
      - name: Create Pull Request
        if: ${{ github.event.release.body != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          BRANCH="changelog-update-$VERSION"
          LABEL="release changelog"

          # Nothing to patch when the changelog was cut locally before the release, which is how this repo
          # works: the [$VERSION] section already exists. Without this, `git commit -am` exits 1 and reds a
          # run whose Marketplace publish has already succeeded.
          if git diff --quiet; then
            echo "::notice::CHANGELOG.md is unchanged - no pull request to open"
            exit 0
          fi

          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          git checkout -b $BRANCH
          git commit -am "Changelog update - $VERSION"
          git push --set-upstream origin $BRANCH

          gh label create "$LABEL" \
            --description "Pull requests with release changelog update" \
            --force \
            || true

          gh pr create \
            --title "Changelog update - \`$VERSION\`" \
            --body "Current pull request contains patched \`CHANGELOG.md\` file for the \`$VERSION\` version." \
            --label "$LABEL" \
            --head $BRANCH
