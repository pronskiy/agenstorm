# Release workflow: runs when the draft release is published.
#
# It does NOT upload to the Marketplace. That happens earlier and by hand, in marketplace-upload.yml, so
# that review is already done by the time a release is published — publishing here means the version is
# genuinely installable. All this does is keep CHANGELOG.md in step and say so if the version is not
# actually being served yet.

name: Release
on:
  # `published` fires for a draft being published, which is how this repo releases. `prereleased` does not
  # fire in that case at all, and `released` would fire a second time on any later edit.
  release:
    types: [ published ]

jobs:

  # Prepare and publish the plugin to JetBrains Marketplace repository
  release:
    name: Finish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Update the Unreleased section with the current release note
      - name: Patch Changelog
        if: ${{ github.event.release.body != '' }}
        env:
          CHANGELOG: ${{ github.event.release.body }}
        run: |
          RELEASE_NOTE="./build/tmp/release_note.txt"
          mkdir -p "$(dirname "$RELEASE_NOTE")"
          echo "$CHANGELOG" > $RELEASE_NOTE

          ./gradlew patchChangelog --release-note-file=$RELEASE_NOTE

      # The upload happened in marketplace-upload.yml. This only reports whether review has landed, so a
      # release published too early is visible as a warning rather than as a silent lie.
      - name: Check Marketplace
        run: |
          PLUGIN_ID=$(grep -E '^pluginGroup' gradle.properties | cut -d '=' -f2 | tr -d ' ')
          VERSION="${{ github.event.release.tag_name }}"
          SERVED=$(curl -sf --max-time 30 "https://plugins.jetbrains.com/plugins/list/?pluginId=$PLUGIN_ID" \
            | grep -oE '<version>[^<]*</version>' | sed -E 's#</?version>##g' || true)
          echo "Marketplace is serving: ${SERVED:-nothing}"
          if printf '%s\n' "$SERVED" | grep -qx "$VERSION"; then
            echo "::notice::$VERSION is being served - this release is installable"
          else
            echo "::warning::$VERSION is NOT being served yet. Either it was never uploaded (run Marketplace upload) or review is still running."
          fi

      # Create a pull request
      - name: Create Pull Request
        if: ${{ github.event.release.body != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          BRANCH="changelog-update-$VERSION"
          LABEL="release changelog"

          # Nothing to patch when the changelog was cut locally before the release, which is how this repo
          # works: the [$VERSION] section already exists. Without this, `git commit -am` exits 1 and reds a
          # run whose Marketplace publish has already succeeded.
          if git diff --quiet; then
            echo "::notice::CHANGELOG.md is unchanged - no pull request to open"
            exit 0
          fi

          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          git checkout -b $BRANCH
          git commit -am "Changelog update - $VERSION"
          git push --set-upstream origin $BRANCH

          gh label create "$LABEL" \
            --description "Pull requests with release changelog update" \
            --force \
            || true

          gh pr create \
            --title "Changelog update - \`$VERSION\`" \
            --body "Current pull request contains patched \`CHANGELOG.md\` file for the \`$VERSION\` version." \
            --label "$LABEL" \
            --head $BRANCH
