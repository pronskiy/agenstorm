settings.links.enabled=Make path:line:col locations clickable in Markdown, comments and PHP strings
settings.group.scratch=Scratch files
settings.scratch.enabled=Show only the allow-listed languages in the New Scratch File popup
settings.scratch.allowList.comment=One language per line, as named under Settings \u2192 Editor \u2192 File Types (for example Plain text, Markdown, PHP, JavaScript, JSON, YAML). A file type name works too. The popup keeps this order and ends with "All Languages\u2026".
settings.scratch.addCurrentLanguage=Add Current File's Language
settings.scratch.addLanguage=Add Language\u2026
settings.scratch.chooseLanguage.title=Registered Languages
scratch.newFile.text=Scratch File
scratch.newFile.description=Create a new scratch file with the chosen language
scratch.newFile.popup.title=New Scratch File
scratch.newFile.allLanguages=All Languages\u2026
settings.group.frame=Window title
