settings.commit.cli.extraArgs.comment=Appended to claude -p --output-format stream-json --verbose --include-partial-messages. The defaults disable tools, session files, MCP servers and, through --safe-mode, your CLAUDE.md, plugins, skills and hooks; extended thinking is switched off through MAX_THINKING_TOKENS=0. Adjust here if a newer CLI renames a flag.
