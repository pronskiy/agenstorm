settings.group.commit=Commit messages
settings.commit.enabled=Generate commit messages with an LLM from the commit toolbar
settings.group.tabs=Project tabs
settings.tabs.enabled=Show project tabs inside the main toolbar
settings.tabs.mirrorBounds=Move the other window onto this one's position and size when switching
settings.tabs.mirrorBounds.comment=Only where projects get a window each. On macOS they share one window, so there is nothing to move.
settings.tabs.showIcons=Show project icons on the tabs
settings.tabs.maxWidth=Max tab width (px):
settings.tabs.maxWidth.comment=Between 72 and 600; longer project names are shortened with an ellipsis.
settings.tabs.branchInStatusBar=Show the Git branch in the status bar instead of the toolbar
settings.tabs.branchInStatusBar.comment=Bottom-left, where the navigation bar was; the toolbar's VCS widget is hidden meanwhile.
settings.group.markdown=Markdown live markup
settings.markdown.liveMarkup.enabled=Hide Markdown syntax until the caret reaches the line
settings.markdown.checkboxes=Show task checkboxes as \u2610 / \u2611 and toggle them with a click
settings.markdown.bullets=Show list bullets as \u2022
settings.markdown.bullets.comment=The Live Markup button in a Markdown editor's toolbar overrides the switch above for that editor.
settings.markdown.revealScope=Show hidden syntax for
settings.markdown.revealScope.element=the element at the caret
settings.markdown.revealScope.line=the whole caret line
settings.markdown.revealScope.comment=Heading marks, bullets and checkboxes always show for the whole caret line.
settings.markdown.codeBlocks=Render fenced code blocks as a card
settings.markdown.blockQuotes=Render block quotes as a card with an accent bar
settings.markdown.rules=Render thematic breaks (---) as a full-width line

settings.group.terminalMaximize=Terminal size
settings.terminal.maximize.enabled=Add a button and a shortcut that fill the window with the terminal
terminal.maximize.notice.title=Tool window layout changed
terminal.maximize.notice.content=Agenstorm turned on the widescreen tool window layout so the terminal fills the editor's area instead of the whole window \u2014 side tool windows keep their full height. Switching the Terminal size feature off puts your layout back.
terminal.maximize.notice.settings=Settings\u2026
terminal.maximize.shortcut.notice.title={0} now maximizes the terminal
terminal.maximize.shortcut.notice.content=It was {0} \u2014 Agenstorm''s Maximize Terminal wins that keystroke while this feature is on. Nothing in your keymap was changed: rebind either action under Settings | Keymap, or switch the feature off to give the keystroke back.
terminal.maximize.shortcut.notice.settings=Settings\u2026
settings.terminal.maximize.comment=The terminal fills the editor's area; other tool windows keep their place. That needs the widescreen tool window layout, which Agenstorm turns on the first time you use the toggle and puts back when you switch this off. Default shortcut: \u2318\u2325M on macOS, \u2325\u21e7F12 elsewhere. On macOS that keystroke is also Extract Method: while this feature is on, Maximize Terminal wins it. Nothing in your keymap is changed \u2014 rebind either action under Settings | Keymap, or switch this off, and it goes back to the refactoring.
action.Agenstorm.ToggleTerminalMaximized.text=Maximize Terminal
action.Agenstorm.ToggleTerminalMaximized.description=Fill the window with the terminal; press again to hide it and return to the editor
settings.group.terminal=Terminal
settings.terminal.open.enabled=Let `open` in an IDE terminal open files and projects in the IDE
settings.terminal.open.commandNames=Command names
settings.terminal.open.commandNames.comment=Comma-separated. Each name shadows the real command inside IDE terminals only; everything the IDE does not claim is passed straight through to it. Terminals that are already running keep their environment until you restart them.
settings.terminal.open.unknownFileTypes=Also claim files the IDE treats as binary
settings.terminal.open.unknownFileTypes.comment=Off by default, so a PDF or a PNG still opens in the app macOS would use.

# terminal (Epic G): the one-shot first-run notice
terminal.open.notice.title=`open` now opens in this IDE
terminal.open.notice.content=Inside IDE terminals only, `open src/Foo.php:42:7` opens that file here with the caret on line 42. Flags, URLs, paths that do not exist and everything else are passed straight through to the real `open`.
terminal.open.notice.settings=Settings

# terminal (Epic K): the IDE as $EDITOR
settings.group.terminalEditor=Terminal editor
settings.terminal.editor.enabled=Let $EDITOR in an IDE terminal open the file in this IDE
settings.terminal.editor.comment=Programs that hand a file to $EDITOR \u2014 Claude Code with Ctrl+G, git commit, crontab -e \u2014 open it here and wait until you close the tab, which is when the edited text goes back to them. Inside IDE terminals only, and it wins over an EDITOR or VISUAL exported by your shell profile; that editor still handles anything the IDE does not take. Terminals that are already running keep their environment until you restart them.
terminal.editor.notice.title=$EDITOR now opens in this IDE
terminal.editor.notice.content=Inside IDE terminals only, a program that reaches for $EDITOR or $VISUAL \u2014 Claude Code with Ctrl+G, git commit, crontab -e \u2014 opens the file here. Close the tab when you are done and the edited text goes back to it.
terminal.editor.notice.fallback=Inside IDE terminals only, a program that reaches for $EDITOR or $VISUAL \u2014 Claude Code with Ctrl+G, git commit, crontab -e \u2014 opens the file here. Close the tab when you are done and the edited text goes back to it. Your own editor ({0}) still handles anything the IDE does not take.
terminal.editor.notice.settings=Settings\u2026

# notifications (Epic L): balloons that hide themselves
settings.group.notifications=Notifications
settings.notifications.autoDismiss.enabled=Hide notification popups automatically
settings.notifications.autoDismiss.seconds=Hide after (seconds):
settings.notifications.autoDismiss.seconds.comment=Between 1 and 600. The IDE's own timers are 10 seconds for a group set to Balloon and 5 minutes for one set to Sticky balloon (Settings | Appearance & Behavior | Notifications). The countdown pauses while the IDE is in the background, and the notification stays in the Notifications tool window either way — only the popup goes.
settings.notifications.autoDismiss.errors=Also hide error notifications
settings.notifications.autoDismiss.errors.comment=Off by default, so errors keep the IDE's five-minute timer and stay long enough to notice.

action.Agenstorm.CopyLocationLink.text=Copy Location Link
action.Agenstorm.CopyLocationLink.description=Copy the caret position as path:line:col relative to the content root (plus a Markdown link flavor)

