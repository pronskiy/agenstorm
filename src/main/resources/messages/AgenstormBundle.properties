name=Agenstorm

settings.display.name=Agenstorm
settings.intro=Every feature can be switched off on its own. Changes apply immediately; some features refresh on the next editor or window update.
settings.group.links=Location links
settings.links.enabled=Make path:line:col locations clickable in Markdown, comments and PHP strings
settings.group.scratch=Scratch files
settings.scratch.enabled=Show only the allow-listed languages in the New Scratch File popup
settings.scratch.allowList.comment=One language per line, as named under Settings \u2192 Editor \u2192 File Types (for example Plain text, Markdown, PHP, JavaScript, JSON, YAML). A file type name works too. The popup keeps this order and ends with "All Languages\u2026".
settings.scratch.addCurrentLanguage=Add Current File's Language
settings.scratch.addLanguage=Add Language\u2026
settings.scratch.chooseLanguage.title=Registered Languages
scratch.newFile.text=Scratch File
scratch.newFile.description=Create a new scratch file with the chosen language
scratch.newFile.popup.title=New Scratch File
scratch.newFile.allLanguages=All Languages\u2026
settings.group.frame=Window title
settings.frame.hideFileName=Hide the file name in the window title
settings.group.commit=Commit messages
settings.commit.enabled=Generate commit messages with an LLM from the commit toolbar
settings.group.tabs=Project tabs
settings.tabs.enabled=Show project tabs inside the main toolbar
settings.tabs.mirrorBounds=Move the other window onto this one's position and size when switching
settings.tabs.mirrorBounds.comment=Only where projects get a window each. On macOS they share one window, so there is nothing to move.
settings.tabs.showIcons=Show project icons on the tabs
settings.tabs.maxWidth=Max tab width (px):
settings.tabs.maxWidth.comment=Between 72 and 600; longer project names are shortened with an ellipsis.
settings.tabs.offload.enabled=Offload projects that have been idle, and the least recently used beyond a limit
settings.tabs.offload.enabled.comment=An offloaded project is closed with everything saved; its tab stays, dotted, and one click loads it again. A project with a running terminal command or process is never offloaded.
settings.tabs.offload.minutes=Offload after (minutes idle):
settings.tabs.offload.minutes.comment=Counted since the project window was last in front. Between 5 and 1440.
settings.tabs.offload.maxLoaded=Keep at most this many projects loaded:
settings.tabs.offload.maxLoaded.comment=Beyond it the least recently used project is offloaded. Between 1 and 50.
settings.tabs.branchInStatusBar=Show the Git branch in the status bar instead of the toolbar
settings.tabs.branchInStatusBar.comment=Bottom-left, where the navigation bar was; the toolbar's VCS widget is hidden meanwhile.
settings.group.markdown=Markdown live markup
settings.markdown.liveMarkup.enabled=Hide Markdown syntax until the caret reaches the line
settings.markdown.checkboxes=Show task checkboxes as \u2610 / \u2611 and toggle them with a click
settings.markdown.bullets=Show list bullets as \u2022
settings.markdown.bullets.comment=The Live Markup entry in the editor context menu overrides the switch above for that editor.
settings.markdown.revealScope=Show hidden syntax for
settings.markdown.revealScope.element=the element at the caret
settings.markdown.revealScope.line=the whole caret line
settings.markdown.revealScope.comment=Heading marks, bullets and checkboxes always show for the whole caret line.
settings.markdown.codeBlocks=Render fenced code blocks as a card
settings.markdown.blockQuotes=Render block quotes as a card with an accent bar
settings.markdown.rules=Render thematic breaks (---) as a full-width line
settings.markdown.tables=Render tables in place (click a cell to edit)

settings.group.toolWindows=Tool windows
settings.group.worktrees=Worktrees
settings.worktrees.enabled=Show the worktrees of the repository as tabs above the Project tree
settings.worktrees.folder=Folder for new worktrees:
settings.worktrees.folder.comment=Relative to the main checkout. "+" puts each new worktree here and git ignores the folder through .git/info/exclude. This folder and Claude Code's .claude/worktrees stay excluded from the project that holds them even with the tabs switched off; a change takes effect when the project is reopened.
settings.worktrees.cloneFolders=Clone into new worktrees:
settings.worktrees.cloneFolders.comment=Comma-separated folders copied whole from the main checkout into a worktree "+" makes, so it resolves without reinstalling. On macOS (APFS) and on btrfs or XFS the copy is copy-on-write and takes next to no disk.
settings.worktrees.switch=A click on a worktree tab
settings.worktrees.switch.replace=Replaces the current project in its window
settings.worktrees.switch.keep=Opens the worktree as a project of its own, next to the current one
settings.worktrees.switch.keep.comment=Every worktree you switch to stays open, with a project tab of its own; clicking one that is open brings it to the front.
settings.worktrees.prepare=Worktrees made elsewhere (a terminal, Claude Code)
settings.worktrees.prepareOnOpen=Prepare one when it is first opened here
settings.worktrees.prepareOnOpen.comment=It gets what "+" gives a new worktree: the ignored files .worktreeinclude names (.env* by default) and the folders cloned above, each only where it has none. Its .idea is copied either way.
settings.worktrees.prepareOnAppear=Prepare one as soon as it appears
settings.worktrees.prepareOnAppear.comment=Within seconds of git worktree add or claude -w, so an agent working there has .env and vendor/ without the worktree being opened. A package install the agent starts in those seconds can clash with the copy.
settings.worktrees.runSetup=Run the repository's setup in a new worktree
settings.worktrees.runSetup.comment=Commands from .cursor/worktrees.json (Cursor's format), or .agenstorm/worktrees.json with the same keys, run in the Run tool window of the new worktree with ROOT_WORKTREE_PATH set to the main checkout. For a worktree made elsewhere, right-click its tab → Run Setup Script.
settings.worktrees.tmux=Keep terminals running across worktree switches (tmux)
settings.worktrees.tmux.comment.found=Terminal tabs of a Git project run inside tmux sessions of Agenstorm's own, so a switch can hand the ones running something to the new window. Your own tmux server and ~/.tmux.conf are left alone. Using {0}.
settings.worktrees.tmux.comment.missing=Terminal tabs of a Git project run inside tmux sessions of Agenstorm's own, so a switch can hand the ones running something to the new window. Needs tmux, which was not found: install it with <code>brew install tmux</code>.
settings.group.statusBar=Status bar
settings.statusBar.hideStatusText=Hide the status text
settings.statusBar.hideStatusText.comment=The last message, "Indexing\u2026" and notification titles no longer show at the bottom left; progress bars stay. The platform has no switch for the text alone \u2014 its "Status Text" item swaps it for the navigation bar.
settings.toolWindows.hideRightBar=Hide the right tool window bar
settings.toolWindows.hideRightBar.comment=Tool windows anchored to the right move to the left bar, which leaves the right bar empty \u2014 and the IDE hides an empty bar. They keep their content and still open from View | Tool Windows and their shortcuts; they just open on the left now. Switching this off moves back exactly the ones Agenstorm moved.

settings.group.markdownEditor=Markdown editor
settings.markdown.hideLayoutSwitcher=Hide the editor/preview layout buttons
settings.markdown.hideLayoutSwitcher.comment=The three layout buttons on a Markdown editor. While this is on there is no way to open the preview \u2014 the actions are hidden everywhere, Find Action included \u2014 so switch it off to get the preview back. Other split editors keep their buttons.

settings.group.terminalMaximize=Terminal size
settings.terminal.maximize.enabled=Add a button and a shortcut that fill the window with the terminal
terminal.maximize.notice.title=Tool window layout changed
terminal.maximize.notice.content=Agenstorm turned on the widescreen tool window layout so the terminal fills the editor's area instead of the whole window \u2014 side tool windows keep their full height. Switching the Terminal size feature off puts your layout back.
terminal.maximize.notice.settings=Settings\u2026
terminal.maximize.shortcut.notice.title={0} now maximizes the terminal
terminal.maximize.shortcut.notice.content=It was {0} \u2014 Agenstorm''s Maximize Terminal wins that keystroke while this feature is on. Nothing in your keymap was changed: rebind either action under Settings | Keymap, or switch the feature off to give the keystroke back.
terminal.maximize.shortcut.notice.settings=Settings\u2026
settings.terminal.maximize.comment=The terminal fills the editor's area; other tool windows keep their place. That needs the widescreen tool window layout, which Agenstorm turns on the first time you use the toggle and puts back when you switch this off. Default shortcut: \u2318\u2325M on macOS, \u2325\u21e7F12 elsewhere. On macOS that keystroke is also Extract Method: while this feature is on, Maximize Terminal wins it. Nothing in your keymap is changed \u2014 rebind either action under Settings | Keymap, or switch this off, and it goes back to the refactoring.
action.Agenstorm.ToggleTerminalMaximized.text=Maximize Terminal
action.Agenstorm.ToggleTerminalMaximized.description=Fill the window with the terminal; press again to hide it and return to the editor
settings.group.terminal=Terminal
settings.terminal.open.enabled=Let `open` in an IDE terminal open files and projects in the IDE
settings.terminal.open.commandNames=Command names
settings.terminal.open.commandNames.comment=Comma-separated. Each name shadows the real command inside IDE terminals only; everything the IDE does not claim is passed straight through to it. Terminals that are already running keep their environment until you restart them.
settings.terminal.open.unknownFileTypes=Also claim files the IDE treats as binary
settings.terminal.open.unknownFileTypes.comment=Off by default, so a PDF or a PNG still opens in the app macOS would use.

# terminal (Epic G): the one-shot first-run notice
terminal.open.notice.title=`open` now opens in this IDE
terminal.open.notice.content=Inside IDE terminals only, `open src/Foo.php:42:7` opens that file here with the caret on line 42. Flags, URLs, paths that do not exist and everything else are passed straight through to the real `open`.
terminal.open.notice.settings=Settings

# terminal (Epic K): the IDE as $EDITOR
settings.group.terminalEnhancer=Terminal output
settings.terminal.enhancer.enabled=Fold var_dump, print_r, var_export, JSON and stack traces to one line
settings.terminal.enhancer.comment=In the Reworked terminal, output that one of the rules recognises collapses to a one-line summary; click the \u25b8 in front of it to open the block in place, coloured like code, and again to fold it. The five built-in rules cover PHP dumps, JSON lines and PHP stack traces.
settings.terminal.enhancer.rules.comment=Your own rules: one JSON file per rule in the folder above. A file with a built-in's id replaces that built-in; a saved change is picked up a moment later. See the README for the format.
settings.terminal.enhancer.rules.column.id=Rule
settings.terminal.enhancer.rules.column.source=Source
settings.terminal.enhancer.rules.column.enabled=On
settings.terminal.enhancer.openFolder=Open Rules Folder
settings.terminal.enhancer.reload=Reload
settings.terminal.enhancer.copyBuiltIn=Copy a Built-in Rule\u2026
terminal.enhancer.rules.builtIn=built-in
terminal.enhancer.rules.broken.title=Terminal output rule skipped: {0}
terminal.enhancer.rules.openFolder=Open Rules Folder
terminal.enhancer.rules.disabled.title=Terminal output rule switched off: {0}
terminal.enhancer.rules.disabled.content=It {0}, so it is off until the IDE restarts. The rule comes from {1}.
settings.group.terminalEditor=Terminal editor
settings.terminal.editor.enabled=Let $EDITOR in an IDE terminal open the file in this IDE
settings.terminal.editor.comment=Programs that hand a file to $EDITOR \u2014 Claude Code with Ctrl+G, git commit, crontab -e \u2014 open it here and wait until you close the tab, which is when the edited text goes back to them. Inside IDE terminals only, and it wins over an EDITOR or VISUAL exported by your shell profile; that editor still handles anything the IDE does not take. Terminals that are already running keep their environment until you restart them.
terminal.editor.notice.title=$EDITOR now opens in this IDE
terminal.editor.notice.content=Inside IDE terminals only, a program that reaches for $EDITOR or $VISUAL \u2014 Claude Code with Ctrl+G, git commit, crontab -e \u2014 opens the file here. Close the tab when you are done and the edited text goes back to it.
terminal.editor.notice.fallback=Inside IDE terminals only, a program that reaches for $EDITOR or $VISUAL \u2014 Claude Code with Ctrl+G, git commit, crontab -e \u2014 opens the file here. Close the tab when you are done and the edited text goes back to it. Your own editor ({0}) still handles anything the IDE does not take.
terminal.editor.notice.settings=Settings\u2026

# notifications (Epic L): balloons that hide themselves
settings.group.notifications=Notifications
settings.notifications.autoDismiss.enabled=Hide notification popups automatically
settings.notifications.autoDismiss.seconds=Hide after (seconds):
settings.notifications.autoDismiss.seconds.comment=Between 1 and 600. The IDE's own timers are 10 seconds for a group set to Balloon and 5 minutes for one set to Sticky balloon (Settings | Appearance & Behavior | Notifications). The countdown pauses while the IDE is in the background, and the notification stays in the Notifications tool window either way — only the popup goes.
settings.notifications.autoDismiss.errors=Also hide error notifications
settings.notifications.autoDismiss.errors.comment=Off by default, so errors keep the IDE's five-minute timer and stay long enough to notice.

